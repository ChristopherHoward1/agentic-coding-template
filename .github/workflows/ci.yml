name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify shellcheck is available
        run: command -v shellcheck

      - name: Run lint
        run: bash scripts/lint.sh

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          test_files=(tests/test-*.sh)
          for test_file in "${test_files[@]}"; do
            bash "$test_file"
          done
